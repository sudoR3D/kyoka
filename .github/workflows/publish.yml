name: Publish npm packages

on:
  push:
    tags:
      - "v*"

# OIDC trusted publishing — no NPM_TOKEN secret
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      # packages export ./dist — must build before tests that import workspace packages
      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm CLI ≥ 11.5.1
      - name: Ensure modern npm
        run: npm install -g npm@latest

      - name: Publish @kyoka-js/kyoka
        working-directory: packages/kyoka
        run: npm publish --access public

      - name: Publish @kyoka-js/stripe
        working-directory: packages/stripe
        run: npm publish --access public

      - name: Publish @kyoka-js/client
        working-directory: packages/client
        run: npm publish --access public
